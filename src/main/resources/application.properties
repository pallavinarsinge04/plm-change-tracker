spring.application.name=plmtracker
# Mini PLM already uses 8080, so the tracker uses 8081
server.port=8081

# ---- Database (values come from environment variables) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/plmtracker?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Actuator: only expose health and info ----
management.endpoints.web.exposure.include=health,info

# ---- Jira. Never hard-code these. ----
app.jira.base-url=${JIRA_BASE_URL:}
app.jira.email=${JIRA_EMAIL:}
app.jira.api-token=${JIRA_API_TOKEN:}
app.jira.project-key=${JIRA_PROJECT_KEY:KAN}
app.jira.issue-type=${JIRA_ISSUE_TYPE:Task}
app.jira.connect-timeout=5s
app.jira.read-timeout=10s

# How often FAILED change requests are retried against Jira
app.jira.retry-interval=60s

# Shared secret Jira must send as ?token=... on the webhook URL. Empty = webhook rejects everything.
app.jira.webhook-secret=${JIRA_WEBHOOK_SECRET:}

# Mini PLM (project 1). Leave MINIPLM_BASE_URL empty to switch part validation off.
app.miniplm.base-url=${MINIPLM_BASE_URL:}
app.miniplm.email=${MINIPLM_EMAIL:}
app.miniplm.password=${MINIPLM_PASSWORD:}
app.miniplm.connect-timeout=3s
app.miniplm.read-timeout=5s
